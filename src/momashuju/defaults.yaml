# momashuju 默认配置
# 所有值可被项目级 novel.yaml 覆盖

# ── LLM 模型参数 ──
llm:
  provider: claude                    # claude / deepseek / openai
  model: claude-sonnet-4-6            # 默认模型
  max_tokens: 8192
  temperature: 0.7
  # 各 Agent 专用模型（可选覆盖）
  agents:
    architect:
      model: claude-sonnet-4-6
      temperature: 0.8
    writer:
      model: claude-sonnet-4-6
      temperature: 0.9
      max_tokens: 16384
    reviser:
      model: claude-sonnet-4-6
      temperature: 0.6
    auditor:
      model: claude-sonnet-4-6
      temperature: 0.3

# ── 上下文管理 ──
context:
  max_history_chapters: 3             # 保留最近 N 章的摘要
  summary_max_tokens: 2000            # 每章摘要最大 token 数
  character_state_max_tokens: 1500    # 角色状态摘要上限

# ── 确定性验证规则阈值 ──
rules:
  # 规则1: 禁止句式检测
  banned_patterns:
    enabled: true
    patterns:
      - "不是……而是……"
      - "不仅……而且……"

  # 规则2: 破折号禁用
  no_em_dash:
    enabled: true

  # 规则3: 过渡词密度 (次/千字)
  transition_density:
    enabled: true
    max_per_1000_chars: 1
    words: ["仿佛", "忽然", "竟然", "突然", "蓦然"]

  # 规则4: 高疲劳词频率 (次/章)
  fatigue_words:
    enabled: true
    max_per_chapter: 1
    words: ["震撼", "惊骇", "恐惧", "颤抖", "战栗", "毛骨悚然"]

  # 规则5: 元叙事检测
  no_meta_narration:
    enabled: true
    patterns: ["读者朋友们", "各位看官", "值得一提的是", "我们来说说"]

  # 规则6: 报告术语检测
  no_report_terms:
    enabled: true
    terms: ["综上所述", "总而言之", "数据显示", "研究表明"]

  # 规则7: 作者说教检测
  no_author_preaching:
    enabled: true
    words: ["显然", "不言而喻", "众所周知", "毫无疑问"]

  # 规则8: 集体反应检测
  no_collective_reaction:
    enabled: true
    patterns: ["全场震惊", "众人哗然", "所有人都", "大家纷纷"]

  # 规则9: 连续"了"检测
  consecutive_le:
    enabled: true
    max_consecutive: 4

  # 规则10: 段落长度控制
  paragraph_length:
    enabled: true
    max_chars: 300
    max_exceed_segments: 2

  # 规则11: 专属禁止列表（可在 novel.yaml 中覆盖）
  custom_banned:
    enabled: true
    words: []

# ── 评分体系权重 ──
scoring:
  weights:
    plot_consistency: 0.20       # 情节一致性
    character_consistency: 0.20  # 人物一致性
    pacing: 0.15                 # 节奏评估
    foreshadowing: 0.15          # 伏笔回收
    readability: 0.10            # 可读性
    outline_adherence: 0.10      # 大纲吻合度
    style_compliance: 0.10       # 风格遵守
  pass_threshold: 0.70           # 通过阈值

# ── 路径配置 ──
paths:
  novels_dir: novels             # 小说项目根目录
  output_dir: output             # 生成输出目录
  checkpoints_dir: checkpoints   # 断点保存目录
