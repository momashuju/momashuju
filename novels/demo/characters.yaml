# ═══════════════════════════════════════════════
# 角色档案
# ═══════════════════════════════════════════════

characters:
  - name: "巫劫"
    role: "主角"
    age: "20岁左右"
    gender: "男"
    appearance: "黑发黑瞳，身材结实但不魁梧，面相温和，常年穿着简朴的布衣。因战争历练，眼神中偶尔透出坚毅。"
    personality: "充满热情和正义感，待人真诚，但在感情方面极其迟钝。与多位女性角色存在暧昧关系而不自知。对琪莎拉的天然行为常常手足无措。"
    desire: "在战后过上平静的生活"
    fear: "再次失去重要的人"
    abilities:
      - "剑术精通（战争历练）"
      - "生活技能（做饭、打猎）"
    relationships:
      - target: "琪莎拉"
        relation: "救命恩人/同居者"
        description: "战争中被琪莎拉所救，战后将她带回村子同居。对琪莎拉缺乏常识的举动感到苦恼但从不真正生气。"
        attitude: "complicated"
      - target: "爱丽丝"
        relation: "青梅竹马"
        description: "从小一起长大，十四年的交情。从未认真思考过与爱丽丝的关系定义。"
        attitude: "positive"
    knowledge_boundary: "不知道琪莎拉对他的感情是喜欢还是单纯依赖。不知道爱丽丝对他的暗恋。"
    speech_style: "温和、略带吐槽属性。面对尴尬场景时话会变多（试图解释）。"
    arc: "从感情迟钝逐渐意识到身边人的感情，学会正视自己的心意。"

  - name: "琪莎拉"
    role: "女主"
    age: "约300岁（人形外表约17-18岁）"
    gender: "女"
    appearance: "银白长发披散至腰际，琥珀色的竖瞳。身材纤细，容貌精致得不似人类。常穿巫劫从镇上买来的偏大睡裙。"
    personality: "呆萌、天真、话少。因从未接触人类而对人类社会的规则毫无概念。表达喜欢的方式直接而纯粹——拥抱、依偎、直白的语言。"
    desire: "留在巫劫身边"
    fear: "被巫劫抛弃/与巫劫分开"
    abilities:
      - "龙族变身（银龙形态，人形态下受限）"
      - "远超人类的感官（嗅觉极强）"
      - "基础魔力操控"
    relationships:
      - target: "巫劫"
        relation: "救命对象/最重要的人"
        description: "战争中救了巫劫，之后将他视为最重要的同伴。靠气味记住巫劫，认为巫劫的气味=安全。"
        attitude: "positive"
    knowledge_boundary: "完全不懂人类社会的羞耻概念和男女规范。不理解'衣服'、'隐私'等概念的意义。"
    speech_style: "极简短，直白。'饿''冷''喜欢''巫劫很暖和'。从不说长句。"
    arc: "逐渐学习人类社会的规则，但保持纯真的本质。"

  - name: "爱丽丝"
    role: "女主"
    age: "约19岁"
    gender: "女"
    appearance: "棕色长发常扎成马尾，蓝色眼睛。身穿朴素的村姑连衣裙，围一条白色围裙。"
    personality: "傲娇。嘴上不饶人，心里比谁都关心巫劫。生气时反而沉默，真正的愤怒不是大吵大闹而是冷暴力。"
    desire: "希望巫劫能明白自己的心意"
    fear: "巫劫被别人抢走"
    abilities:
      - "烘焙（村里最好的面包师傅）"
      - "家务全能"
    relationships:
      - target: "巫劫"
        relation: "青梅竹马/暗恋对象"
        description: "认识十四年，一直以青梅竹马的身份待在巫劫身边。从未告白，以为'按部就班走下去自然会水到渠成'。"
        attitude: "positive"
    knowledge_boundary: "不知道琪莎拉是龙族。不知道巫劫对琪莎拉的感情只是责任和感激。"
    speech_style: "傲娇式发言——'我怎么会喜欢你这种笨蛋'。生气时话极少。"
    arc: "从被动等待到主动表达心意，学会直面自己的感情。"
