chapters:
  - chapter_number: 1
    title: "战争结束了"
    milestone_events:
      - "巫劫带回琪莎拉，向村口守卫介绍"
      - "琪莎拉饿了，巫劫决定回家做饭"
    goals:
      - "建立战后归乡的氛围"
      - "引入琪莎拉的特殊性（龙族、缺乏常识的伏笔）"
      - "引入爱丽丝的位置（青梅竹马）"
    conflicts:
      - "琪莎拉在巫劫面前换衣服（洗澡），被爱丽丝撞见"
    foreshadowing_plant:
      - "琪莎拉是龙族（为后续龙族相关情节铺垫）"
      - "爱丽丝对巫劫的感情（为后续感情线铺垫）"
    hook: "爱丽丝转身快步离去——明明是我先来的。"
    pov_character: "巫劫"
    estimated_words: 3000

  - chapter_number: 2
    title: "灾难般的一周"
    milestone_events:
      - "琪莎拉钻进巫劫被窝（第三天早上）"
      - "琪莎拉在洗澡时推门而入（某天晚上）"
      - "琪莎拉在集市拥抱巫劫（某天白天）"
    goals:
      - "通过多个场景展现琪莎拉的'无常识'"
      - "展现巫劫的狼狈应对"
      - "累积爱丽丝的误解与情绪"
    conflicts:
      - "琪莎拉的天然行为 vs 人类社会规范"
      - "巫劫的迟钝 vs 爱丽丝的暗恋"
    foreshadowing_plant:
      - "琪莎拉靠气味识别巫劫（为'闻'的行为铺垫龙族本能）"
    hook: "爱丽丝面无表情地看着这一切，然后默默地转过身。"
    pov_character: "巫劫"
    estimated_words: 3000

  - chapter_number: 3
    title: "明明是我先来的"
    milestone_events:
      - "第五天早晨，爱丽丝第一次撞见琪莎拉钻被窝"
      - "第五天中午，巫劫在井边找到爱丽丝，爱丽丝沉默以对"
      - "第七天傍晚，爱丽丝主动来道歉，再次撞见亲近场景"
      - "第七天夜晚，爱丽丝哭着告白"
    goals:
      - "爱丽丝的情绪从不安→害怕→自省→崩溃的完整弧线"
      - "推动三角关系的情感爆发"
      - "章末给读者留下强烈的情绪共鸣"
    conflicts:
      - "爱丽丝的内心矛盾（喜欢巫劫 vs 害怕失去）"
      - "巫劫面对爱丽丝眼泪时的不知所措"
    hook: "爱丽丝踮起脚尖，吻了上去。"
    pov_character: "巫劫"
    estimated_words: 4000
