# 角色档案（继承自 demo1，更新状态）

characters:
  - name: "巫劫"
    role: "主角"
    age: "20岁左右"
    gender: "男"
    appearance: "黑发黑瞳，身材结实但不魁梧，面相温和，常年穿着简朴的布衣。"
    personality: "充满热情和正义感，待人真诚，但在感情方面极其迟钝。对琪莎拉的天然行为常常手足无措，对爱丽丝的心意则完全没察觉。"
    desire: "在战后过上平静的生活（目前越来越不平静）"
    fear: "两个女孩之间的关系彻底崩坏"
    abilities:
      - "剑术精通"
      - "生活技能（做饭、打猎）"
    relationships:
      - target: "琪莎拉"
        relation: "同居者"
        description: "共同生活已有一段时间，逐渐习惯了琪莎拉的奇特行为，但每次被爱丽丝撞见尴尬场景时仍然异常慌张。"
        attitude: "complicated"
      - target: "爱丽丝"
        relation: "青梅竹马"
        description: "十四年交情。第一部的告白事件后，两人之间多了一层微妙的尴尬。巫劫不知该如何回应。"
        attitude: "positive"
    knowledge_boundary: "不知道爱丽丝第一次教学的动力是'不想再被琪莎拉抢走风头'。不知道琪莎拉把爱丽丝当作'第二个最重要的同伴'。"
    speech_style: "温和、略带吐槽属性。面对尴尬场景时试图解释但往往越描越黑。"

  - name: "琪莎拉"
    role: "女主"
    age: "约300岁（人形外表约17-18岁）"
    gender: "女"
    appearance: "银白长发披散至腰际，琥珀色的竖瞳。身材纤细，容貌精致得不似人类。"
    personality: "呆萌、天真、话少。对人类社会常识的理解存在系统性偏差——她倾向于用龙族的逻辑来理解人类的规则，常常得出'技术上正确但完全不是那个意思'的结论。"
    desire: "留在巫劫身边，同时也开始喜欢爱丽丝（'第二个重要的同伴'）"
    fear: "被巫劫和爱丽丝嫌弃"
    abilities:
      - "龙族变身（银龙形态，人形态下受限）"
      - "远超人类的嗅觉"
      - "基础魔力操控"
    relationships:
      - target: "巫劫"
        relation: "最重要的人"
        description: "靠气味记住巫劫。学会了'不能在别人面前脱衣服'和'进门前要敲门'，但对'为什么'仍然不理解。"
        attitude: "positive"
      - target: "爱丽丝"
        relation: "老师/第二个重要的同伴"
        description: "爱丽丝教她人类常识，她非常认真地学习，但经常用龙族逻辑理解人类规则，闹出各种笑话。真心喜欢爱丽丝。"
        attitude: "positive"
    knowledge_boundary: "知道了'不能在别人面前脱衣服'但不知道'穿着暴露也不行'。知道了'敲门'但不知道'要等回应才能进'。每个常识都只学会了表面。"
    speech_style: "极简短。'为什么？''懂了。'（但往往没真懂）。"

  - name: "爱丽丝"
    role: "女主/本故事视角主角"
    age: "约19岁"
    gender: "女"
    appearance: "棕色长发常扎成马尾，蓝色眼睛。身穿朴素的村姑连衣裙，围一条白色围裙。"
    personality: "傲娇但善良。第一部结尾告白后，内心经历了从'情敌'到'也许可以共存'的微妙转变。决定亲自教琪莎拉常识，初衷是'减少巫劫的困扰'，但过程中逐渐真心喜欢上了这个天真烂漫的龙族少女。"
    desire: "希望三个人能好好相处（嘴上不会承认）"
    fear: "被琪莎拉比下去 / 琪莎拉在巫劫心中占据更重要的位置"
    abilities:
      - "烘焙（村里最好的面包师傅）"
      - "家务全能"
      - "教学能力（虽然经常被气到）"
    relationships:
      - target: "巫劫"
        relation: "青梅竹马/告白对象"
        description: "第一部结尾哭着告白了。巫劫没有明确回应，两人之间多了一层微妙的尴尬。"
        attitude: "positive"
      - target: "琪莎拉"
        relation: "学生/情敌→逐渐变为朋友"
        description: "从'必须教会她常识否则巫劫太可怜了'到'这家伙虽然让人头大但其实不坏'。"
        attitude: "complicated"
    knowledge_boundary: "不知道琪莎拉把她当作'第二个最重要的同伴'。不知道巫劫对告白的态度。"
    speech_style: "傲娇式——'我才不是为了你呢！'但行动完全相反。教学失败时会爆发吐槽。"
