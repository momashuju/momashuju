# 章节大纲 — demo2：常识教学的大失败

chapters:
  - chapter_number: 1
    title: "爱丽丝老师的常识课堂"
    milestone_events:
      - "爱丽丝宣布要教琪莎拉人类常识"
      - "第一课：穿衣服的正确方式（理论→实践→琪莎拉理解偏差→尴尬事件）"
      - "第二课：敲门（琪莎拉学会了敲门但没学会等回应→尴尬事件）"
      - "爱丽丝的第一次内心反思"
    goals:
      - "建立爱丽丝作为'老师'的新身份"
      - "通过2-3个教学失败场景，展现琪莎拉奇特的理解方式"
      - "展现爱丽丝从敌意到无奈的转变"
      - "埋下两人类系改善的伏笔"
    conflicts:
      - "琪莎拉的龙族逻辑 vs 人类社会常识"
      - "爱丽丝的教学热情 vs 教学的挫败感"
      - "巫劫作为尴尬事件的'受害者'，夹在两个女孩之间"
    foreshadowing_plant:
      - "琪莎拉问爱丽丝'你也是巫劫的伴侣吗'（龙族视角下的三角关系理解）"
    hook: "爱丽丝看着琪莎拉认真的琥珀色眼睛，忽然觉得自己也许——只是也许——可以和她成为朋友。"
    pov_character: "爱丽丝"
    estimated_words: 4000

  - chapter_number: 2
    title: "龙族逻辑与人类规则的碰撞"
    milestone_events:
      - "第三课：烹饪（琪莎拉认为'火=龙息'，差点烧了厨房）"
      - "第四课：购物（琪莎拉不理解'付钱'，用龙族'以物易物'逻辑拿了一颗宝石想换面包）"
      - "一次意外中，琪莎拉用龙族能力保护了爱丽丝"
      - "爱丽丝的态度发生质的转变"
    goals:
      - "通过更多教学场景进一步展现搞笑冲突"
      - "在喜剧中插入一个温情时刻（琪莎拉保护爱丽丝）"
      - "完成爱丽丝对琪莎拉态度的转变"
    conflicts:
      - "琪莎拉的龙族本能（龙息、以物易物）vs 人类规则"
      - "爱丽丝的傲娇 vs 内心逐渐软化的感情"
    foreshadowing_plant:
      - "琪莎拉展示龙族能力（为后续可能的冲突场景做铺垫）"
    hook: "'你……你刚才为什么要保护我？'爱丽丝问。琪莎拉歪了歪头，理所当然地说：'因为爱丽丝是同伴。'"
    pov_character: "爱丽丝"
    estimated_words: 3500
