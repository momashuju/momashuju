# 世界观设定（继承自 demo1）
name: "艾尔德兰大陆"
era: "中世纪"
genre: "西幻/异世界/高魔"

magic_system: |
  魔力存在于万物之中。人类通过魔法阵和咒语操控魔力，龙族天生拥有强大的魔力。
  龙族可以化为人形，但在人形状态下魔力会受到一定限制。

geography: |
  大陆中部的人类王国刚刚结束一场与魔族的大规模战争。
  巫劫所在的村子位于王国边境，是一个远离战火的宁静小村。

factions:
  - "人类王国联盟"
  - "龙族（中立，少数与人类结盟）"
  - "魔族残部"

history: |
  三年前魔族入侵，人类王国联盟奋起抵抗。战争中龙族参战支持人类一方。
  巫劫作为战士参与了战争，在一次遭遇战中被龙族少女琪莎拉所救。
  战争于近日结束。

rules:
  - "龙族可以化为人形，人形态力量受限"
  - "龙族与龙群之间存在感应，远离龙群后感应会减弱"
  - "龙族拥有远超人类的寿命（数百年到数千年）"

notes: "本故事设定在第一部（青梅与龙族少女的一周）之后，三人已在村子里共同生活了一段时间。"
