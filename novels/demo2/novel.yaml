# ═══════════════════════════════════════════════
# 小说项目配置 — demo2：常识教学的大失败
# ═══════════════════════════════════════════════

title: "常识教学的大失败"
author: "moma"
summary: "爱丽丝决定亲自教琪莎拉人类社会的常识，但每一次教学都以一场与巫劫有关的尴尬事件告终。然而在这些乌龙中，两人开始理解彼此。"
genre: "西幻/异世界/后宫/日常"

style:
  pov: third_limited
  tense: past
  language_style: light_novel
  banned_words:
    - "震撼"
    - "惊骇"
  banned_patterns:
    - "不是……而是……"
  required_elements:
    - "每节课至少引出一件与巫劫相关的尴尬事件"
    - "每件事后至少一处爱丽丝的内心反思"
  notes: "轻小说风格，偏轻松日常。聚焦于琪莎拉对常识的奇特理解方式，以及爱丽丝从敌意到接纳的心理变化。视角以爱丽丝为主。"
  paragraph_max_chars: 300

rules:
  custom_banned:
    words:
      - "毁天灭地"
      - "恐怖如斯"
